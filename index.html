<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090b">
<meta name="description" content="Legacy Esports member profile photo gallery.">
<title>Legacy Esports | Members</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--gold:#c9a34a;--line:#292a2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{width:min(1180px,94%);margin:0 auto;padding:28px 0 48px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.photo{width:100%;aspect-ratio:1;display:block;object-fit:cover;border:1px solid #65502b;border-radius:12px;background:#151515}
.empty,.error{color:#aaa;text-align:center;padding:32px 12px;grid-column:1/-1;border:1px dashed var(--line);border-radius:12px}
@media(max-width:520px){main{width:calc(100% - 24px);padding-top:18px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{border-radius:9px}}
</style>
</head>
<body>
<main>
<div class="gallery" id="gallery" aria-label="Legacy Esports member profile pictures">
<div class="empty">Loading…</div>
</div>
</main>
<script>
const gallery=document.getElementById('gallery');
async function loadProfilePictures(){
 try{
  const response=await fetch('https://tcdqqqicflmobpzcwdte.supabase.co/rest/v1/legacy_members?select=image_url,image_size&image_url=not.is.null&order=sort_order.asc,created_at.asc',{headers:{apikey:'sb_publishable_cwjt8qobOKwQKYDLXZ591w_vUv1q7-n'}});
  if(!response.ok)throw new Error('Unable to load pictures');
  const members=await response.json();
  gallery.replaceChildren();
  const pictures=members.filter(member=>typeof member.image_url==='string'&&member.image_url.trim());
  if(!pictures.length){
   const empty=document.createElement('div');empty.className='empty';empty.textContent='No profile pictures have been added yet.';gallery.append(empty);return;
  }
  for(const member of pictures){
   const image=document.createElement('img');
   image.className='photo';
   image.src=member.image_url;
   image.alt='Legacy Esports member profile picture';
   image.loading='lazy';
   image.decoding='async';
   gallery.append(image);
  }
 }catch(error){
  gallery.replaceChildren();
  const message=document.createElement('div');message.className='error';message.textContent='Profile pictures are temporarily unavailable.';gallery.append(message);
 }
}
loadProfilePictures();
</script>
</body>
</html>
